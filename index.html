
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora TRL | PUCP</title>
    <!-- Tailwind CDN para asegurar que el diseño se vea igual al prototipo siempre -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#002B5B',
              secondary: '#00AEEF',
              accent: '#F9B115',
            },
            animation: {
              'bounce-slow': 'bounce-slow 4s infinite ease-in-out',
              'fadeIn': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                from: { opacity: '0', transform: 'translateY(20px)' },
                to: { opacity: '1', transform: 'translateY(0)' },
              },
              'bounce-slow': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      input::placeholder, textarea::placeholder { color: #000 !important; opacity: 0.75 !important; }
        :root {
          --primary: #002B5B;
          --secondary: #00AEEF;
          --accent: #F9B115;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Plus Jakarta Sans fuses "fi" into a ligature that drops the dot of the i
               ("Defnición"); render the letters separately everywhere. */
            font-variant-ligatures: no-common-ligatures;
            overflow-x: clip;
            background: linear-gradient(135deg, #fef9c3 0%, #ffffff 40%, #ffffff 100%);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        .shape {
            position: absolute;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
          background: var(--primary);
          border-radius: 10px;
        }
        /* Thin, near-invisible scrollbar for the result dashboard's per-card overflow fallback */
        .result-scroll {
          scrollbar-width: thin;
          scrollbar-color: transparent transparent;
        }
        .result-scroll::-webkit-scrollbar {
          width: 4px;
        }
        .result-scroll::-webkit-scrollbar-track {
          background: transparent;
        }
        .result-scroll::-webkit-scrollbar-thumb {
          background: transparent;
          border-radius: 10px;
        }
        .result-scroll:hover {
          scrollbar-color: rgba(0, 59, 145, 0.3) transparent;
        }
        .result-scroll:hover::-webkit-scrollbar-thumb {
          background: rgba(0, 59, 145, 0.3);
        }
        @media print {
          * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            color-adjust: exact !important;
          }
          body {
            background: #fff;
          }
          .shape {
            display: none !important;
          }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
<body class="text-slate-900 selection:bg-cyan-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
